name: Solar Dashboard
version: "1.8.4"
slug: solar_dashboard
description: 3D solar/battery/grid live dashboard for EG4/Luxpower (read-only)
url: https://github.com/joyfulhouse/pylxpweb
arch:
  - aarch64
init: false
startup: services
boot: auto
ports:
  5050/tcp: 5050
